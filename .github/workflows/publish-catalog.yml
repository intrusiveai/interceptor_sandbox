name: publish Interceptor release catalog
run-name: ${{ inputs.request_id || 'Manual Interceptor catalog retry' }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Correlation ID generated by the publishing workflow
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: interceptor-catalog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'intrusiveai/interceptor_sandbox' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      CONTENT_BUCKET: ${{ vars.CONTENT_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
      GOWORK: 'off'
      GOPROXY: 'off'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/release-publisher/go.mod
          cache: false
      - name: Verify catalog entry against the tagged release assets
        id: entry
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          python3 scripts/publish_release.py catalog-context
          --tag "$RELEASE_TAG"
          --source "$GITHUB_SHA"

      - name: Validate catalog entry before assuming AWS role
        working-directory: tools/release-publisher
        env:
          ENTRY_JSON: ${{ steps.entry.outputs.json }}
        run: |
          printf '%s\n' "$ENTRY_JSON" > "$RUNNER_TEMP/catalog-entry.json"
          go run ./cmd/catalog-publisher catalog merge --product interceptor_sandbox \
            --entry "$RUNNER_TEMP/catalog-entry.json" --output "$RUNNER_TEMP/validated-catalog.json"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.CATALOG_PUBLISHER_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com
      - name: Publish and verify public delivery
        working-directory: tools/release-publisher
        run: bash scripts/publish-catalog.sh "$RUNNER_TEMP/catalog-entry.json" interceptor_sandbox
