name: publish Interceptor release catalog
run-name: ${{ inputs.request_id || 'Manual Interceptor catalog retry' }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Correlation ID generated by the publishing workflow
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: interceptor-catalog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  entry:
    if: github.repository == 'intrusiveai/interceptor_sandbox' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      json: ${{ steps.entry.outputs.json }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify catalog entry against the tagged release assets
        id: entry
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          python3 scripts/publish_release.py catalog-context
          --tag "$RELEASE_TAG"
          --source "$GITHUB_SHA"

  publish:
    needs: entry
    permissions:
      contents: read
      id-token: write
    uses: intrusiveai-engineering/releases/.github/workflows/publish-catalog.yml@ba4049627fa4a6602c5ea63efab6fb74c8643a61
    with:
      product: interceptor_sandbox
      entry_json: ${{ needs.entry.outputs.json }}
