name: verify-release-candidates

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main, "candidate-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  context:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.release.outputs.mode }}
      version: ${{ steps.release.outputs.version }}
      branch: ${{ steps.release.outputs.branch }}
      source: ${{ steps.release.outputs.source }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - id: release
        run: python3 scripts/publish_release.py context

  verify:
    needs: context
    if: needs.context.outputs.mode == 'verify' || needs.context.outputs.mode == 'publish'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: "1.26.5"
          cache: true
      - name: Verify Interceptor
        run: |
          make test
          go vet ./...

  candidates:
    needs: [context, verify]
    # main verifies merged code; it never rebuilds the promoted release.
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: "1.26.5"
          cache: true
      - name: Build twice and compare release archive
        env:
          RELEASE_VERSION: ${{ needs.context.outputs.version }}
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: |
          python3 scripts/build_release.py --version "$RELEASE_VERSION" --platform "$TARGET_PLATFORM" --output dist/first
          python3 scripts/build_release.py --version "$RELEASE_VERSION" --platform "$TARGET_PLATFORM" --output dist/second
          diff -r dist/first dist/second
          python3 scripts/publish_release.py verify-archive \
            --archive "dist/first/${TARGET_PLATFORM/\//-}.tar.gz" \
            --version "$RELEASE_VERSION" --source "$GITHUB_SHA"
      - name: Exercise native release binary
        if: matrix.platform == 'linux/amd64'
        env:
          RELEASE_VERSION: ${{ needs.context.outputs.version }}
        run: |
          mkdir dist/installed
          tar -C dist/installed -xzf dist/first/linux-amd64.tar.gz
          test "$(dist/installed/interceptor version)" = "$RELEASE_VERSION"
      - name: Retain release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-candidate-${{ strategy.job-index }}
          path: dist/first/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  packaged-runtime:
    needs: [context, candidates]
    # Exercise the uploaded archives on native Linux architectures. In particular,
    # Darwin's companion must match the Linux archive from the same revision.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            linux_artifact: 0
            darwin_artifact: 2
          - arch: arm64
            runner: ubuntu-24.04-arm
            linux_artifact: 1
            darwin_artifact: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: "1.26.5"
          cache: true
      - name: Download and inspect this run's actual archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LINUX_ARTIFACT: ${{ matrix.linux_artifact }}
          DARWIN_ARTIFACT: ${{ matrix.darwin_artifact }}
          ARCH: ${{ matrix.arch }}
          RELEASE_VERSION: ${{ needs.context.outputs.version }}
        run: |
          gh run download "$GITHUB_RUN_ID" --name "release-candidate-$LINUX_ARTIFACT" --dir dist/archives
          gh run download "$GITHUB_RUN_ID" --name "release-candidate-$DARWIN_ARTIFACT" --dir dist/archives
          for os in linux darwin; do
            python3 scripts/publish_release.py verify-archive \
              --archive "dist/archives/$os-$ARCH.tar.gz" \
              --version "$RELEASE_VERSION" --source "$GITHUB_SHA"
            mkdir -p "dist/$os"
            tar -C "dist/$os" -xzf "dist/archives/$os-$ARCH.tar.gz"
          done
          cmp dist/linux/interceptor dist/darwin/interceptor-linux
          test "$(dist/linux/interceptor version)" = "$RELEASE_VERSION"
          test "$(dist/darwin/interceptor-linux version)" = "$RELEASE_VERSION"
      - name: Qualify the downloaded native Linux archive without Go
        env:
          ARCH: ${{ matrix.arch }}
          RELEASE_VERSION: ${{ needs.context.outputs.version }}
        run: |
          docker pull busybox:1.37.0
          go build -o "$RUNNER_TEMP/local-api-smoke" ./examples/local-api-smoke
          python3 scripts/qualify_release.py --archive "dist/archives/linux-$ARCH.tar.gz" \
            --version "$RELEASE_VERSION" --source "$GITHUB_SHA" \
            --image busybox:1.37.0 --client "$RUNNER_TEMP/local-api-smoke" --output dist/qualification
      - name: Retain archive qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-qualification-linux-${{ matrix.arch }}
          path: dist/qualification/
          if-no-files-found: warn
          retention-days: 14

  publish:
    needs: [context, candidates, packaged-runtime]
    if: >-
      needs.context.outputs.mode == 'publish' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      startsWith(github.ref, 'refs/heads/candidate-v') && !github.event.deleted
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      actions: write
      contents: write
    concurrency:
      group: interceptor-release-v${{ needs.context.outputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Download this run's four verified candidates
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p dist/candidates
          for index in 0 1 2 3; do
            gh run download "$GITHUB_RUN_ID" --name "release-candidate-$index" --dir dist/candidates
          done
      - name: Publish rolling prerelease
        id: publication
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          CANDIDATE_BRANCH: ${{ needs.context.outputs.branch }}
          CANDIDATE_SOURCE: ${{ needs.context.outputs.source }}
        run: >-
          python3 scripts/publish_release.py publish
          --directory dist/candidates
          --branch "$CANDIDATE_BRANCH"
          --source "$CANDIDATE_SOURCE"
      - name: Publish candidate catalog and verify public delivery
        if: steps.publication.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ needs.context.outputs.version }}
          RELEASE_SOURCE: ${{ needs.context.outputs.source }}
        run: >-
          python3 scripts/publish_release.py catalog-sync
          --tag "$RELEASE_TAG"
          --source "$RELEASE_SOURCE"

  promote:
    needs: context
    if: >-
      needs.context.outputs.mode == 'promote' && github.event_name == 'pull_request' &&
      github.event.action == 'closed' && github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'candidate-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      actions: write
      contents: write
      pull-requests: read
    concurrency:
      group: interceptor-release-v${{ needs.context.outputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Promote the merged candidate's existing artifacts
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          RELEASE_PR: ${{ needs.context.outputs.pr }}
        run: python3 scripts/publish_release.py promote --pr "$RELEASE_PR"
      - name: Publish stable catalog and verify public delivery
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ needs.context.outputs.version }}
          RELEASE_SOURCE: ${{ needs.context.outputs.source }}
        run: >-
          python3 scripts/publish_release.py catalog-sync
          --tag "$RELEASE_TAG"
          --source "$RELEASE_SOURCE"
